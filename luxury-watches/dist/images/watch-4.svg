<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Steel case gradient -->
    <linearGradient id="steelCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8cdd2"/>
      <stop offset="20%" stop-color="#a0a8b0"/>
      <stop offset="40%" stop-color="#d0d4d8"/>
      <stop offset="60%" stop-color="#909aa2"/>
      <stop offset="80%" stop-color="#b8c0c8"/>
      <stop offset="100%" stop-color="#a0a8b0"/>
    </linearGradient>
    <!-- Rotating bezel gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a5a3a"/>
      <stop offset="50%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#2a5a3a"/>
    </linearGradient>
    <!-- Green sunburst dial -->
    <radialGradient id="sunburstDial" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2a7a4a"/>
      <stop offset="20%" stop-color="#1e6a3e"/>
      <stop offset="40%" stop-color="#258048"/>
      <stop offset="60%" stop-color="#1a5a34"/>
      <stop offset="80%" stop-color="#1e6838"/>
      <stop offset="100%" stop-color="#145028"/>
    </radialGradient>
    <!-- Sunburst rays -->
    <radialGradient id="sunburstRays" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.06"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <!-- Steel bracelet gradient -->
    <linearGradient id="steelBracelet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#909aa2"/>
      <stop offset="15%" stop-color="#b8c0c8"/>
      <stop offset="30%" stop-color="#a0a8b0"/>
      <stop offset="50%" stop-color="#c8cdd2"/>
      <stop offset="70%" stop-color="#a0a8b0"/>
      <stop offset="85%" stop-color="#b8c0c8"/>
      <stop offset="100%" stop-color="#909aa2"/>
    </linearGradient>
    <!-- Bracelet link side -->
    <linearGradient id="braceletSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0a8b0"/>
      <stop offset="50%" stop-color="#c0c8d0"/>
      <stop offset="100%" stop-color="#a0a8b0"/>
    </linearGradient>
    <!-- Glass reflection -->
    <radialGradient id="glassReflect" cx="40%" cy="33%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <!-- GMT hand gradient -->
    <linearGradient id="gmtHandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e04040"/>
      <stop offset="50%" stop-color="#ff6060"/>
      <stop offset="100%" stop-color="#e04040"/>
    </linearGradient>
    <!-- Shadow filters -->
    <filter id="watchShadow" x="-10%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <!-- Crown gradient -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#909aa2"/>
      <stop offset="50%" stop-color="#d0d4d8"/>
      <stop offset="100%" stop-color="#909aa2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#f0f0f0"/>

  <!-- Surface shadow -->
  <ellipse cx="200" cy="350" rx="65" ry="10" fill="#000" opacity="0.12"/>

  <!-- === UPPER BRACELET (steel Oyster-style) === -->
  <!-- Center links -->
  <rect x="178" y="12" width="44" height="55" rx="2" fill="url(#steelBracelet)" stroke="#808890" stroke-width="0.3"/>
  <!-- Outer links left -->
  <rect x="162" y="14" width="16" height="51" rx="1.5" fill="url(#braceletSide)" stroke="#888e94" stroke-width="0.3"/>
  <!-- Outer links right -->
  <rect x="222" y="14" width="16" height="51" rx="1.5" fill="url(#braceletSide)" stroke="#888e94" stroke-width="0.3"/>
  <!-- Link gap lines upper center -->
  <line x1="178" y1="22" x2="222" y2="22" stroke="#888e94" stroke-width="0.5"/>
  <line x1="178" y1="33" x2="222" y2="33" stroke="#888e94" stroke-width="0.5"/>
  <line x1="178" y1="44" x2="222" y2="44" stroke="#888e94" stroke-width="0.5"/>
  <line x1="178" y1="55" x2="222" y2="55" stroke="#888e94" stroke-width="0.5"/>
  <!-- Outer link gaps -->
  <line x1="162" y1="26" x2="178" y2="26" stroke="#888e94" stroke-width="0.3"/>
  <line x1="162" y1="39" x2="178" y2="39" stroke="#888e94" stroke-width="0.3"/>
  <line x1="162" y1="52" x2="178" y2="52" stroke="#888e94" stroke-width="0.3"/>
  <line x1="222" y1="26" x2="238" y2="26" stroke="#888e94" stroke-width="0.3"/>
  <line x1="222" y1="39" x2="238" y2="39" stroke="#888e94" stroke-width="0.3"/>
  <line x1="222" y1="52" x2="238" y2="52" stroke="#888e94" stroke-width="0.3"/>
  <!-- Center polish highlight -->
  <rect x="190" y="16" width="20" height="48" rx="1" fill="white" opacity="0.1"/>

  <!-- === LOWER BRACELET (steel) === -->
  <rect x="178" y="333" width="44" height="55" rx="2" fill="url(#steelBracelet)" stroke="#808890" stroke-width="0.3"/>
  <rect x="162" y="335" width="16" height="51" rx="1.5" fill="url(#braceletSide)" stroke="#888e94" stroke-width="0.3"/>
  <rect x="222" y="335" width="16" height="51" rx="1.5" fill="url(#braceletSide)" stroke="#888e94" stroke-width="0.3"/>
  <line x1="178" y1="343" x2="222" y2="343" stroke="#888e94" stroke-width="0.5"/>
  <line x1="178" y1="354" x2="222" y2="354" stroke="#888e94" stroke-width="0.5"/>
  <line x1="178" y1="365" x2="222" y2="365" stroke="#888e94" stroke-width="0.5"/>
  <line x1="178" y1="376" x2="222" y2="376" stroke="#888e94" stroke-width="0.5"/>
  <line x1="162" y1="347" x2="178" y2="347" stroke="#888e94" stroke-width="0.3"/>
  <line x1="162" y1="360" x2="178" y2="360" stroke="#888e94" stroke-width="0.3"/>
  <line x1="162" y1="373" x2="178" y2="373" stroke="#888e94" stroke-width="0.3"/>
  <line x1="222" y1="347" x2="238" y2="347" stroke="#888e94" stroke-width="0.3"/>
  <line x1="222" y1="360" x2="238" y2="360" stroke="#888e94" stroke-width="0.3"/>
  <line x1="222" y1="373" x2="238" y2="373" stroke="#888e94" stroke-width="0.3"/>
  <rect x="190" y="337" width="20" height="48" rx="1" fill="white" opacity="0.1"/>

  <!-- === STEEL CASE === -->
  <circle cx="200" cy="200" r="118" fill="url(#steelCase)" filter="url(#watchShadow)"/>
  <circle cx="200" cy="200" r="118" fill="none" stroke="#7a828a" stroke-width="0.8"/>

  <!-- === ROTATING BEZEL (green ceramic, 24h markings) === -->
  <circle cx="200" cy="200" r="110" fill="url(#bezelGrad)" stroke="#1a3a2a" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="104" fill="none" stroke="#3a6a4a" stroke-width="0.3"/>

  <!-- Bezel 24h markings -->
  <g font-family="Arial, sans-serif" font-size="7" fill="#c8d8d0" text-anchor="middle" font-weight="bold">
    <!-- 24/0 at 12 o'clock -->
    <text x="200" y="100" fill="#e8f0e8">24</text>
    <!-- 2 -->
    <text x="242" y="106" transform="rotate(15 242 106)">2</text>
    <!-- 4 -->
    <text x="270" y="128" transform="rotate(30 270 128)">4</text>
    <!-- 6 at 3 o'clock -->
    <text x="284" y="204" transform="rotate(0 284 204)">6</text>
    <!-- 8 -->
    <text x="270" y="278" transform="rotate(-30 270 278)">8</text>
    <!-- 10 -->
    <text x="242" y="300" transform="rotate(-15 242 300)">10</text>
    <!-- 12 at 6 o'clock -->
    <text x="200" y="312">12</text>
    <!-- 14 -->
    <text x="158" y="300" transform="rotate(15 158 300)">14</text>
    <!-- 16 -->
    <text x="130" y="278" transform="rotate(30 130 278)">16</text>
    <!-- 18 at 9 o'clock -->
    <text x="116" y="204">18</text>
    <!-- 20 -->
    <text x="130" y="128" transform="rotate(-30 130 128)">20</text>
    <!-- 22 -->
    <text x="158" y="106" transform="rotate(-15 158 106)">22</text>
  </g>
  <!-- Bezel tick marks -->
  <g stroke="#a0c0a8" stroke-width="0.6">
    <line x1="200" y1="93" x2="200" y2="97"/>
    <line x1="200" y1="303" x2="200" y2="307"/>
    <line x1="93" y1="200" x2="97" y2="200"/>
    <line x1="303" y1="200" x2="307" y2="200"/>
  </g>
  <g stroke="#708878" stroke-width="0.4">
    <!-- Minor ticks between numbers -->
    <line x1="220" y1="94" x2="219" y2="97.8"/>
    <line x1="258" y1="110" x2="256" y2="113"/>
    <line x1="278" y1="140" x2="275.5" y2="142"/>
    <line x1="290" y1="170" x2="287.5" y2="171.5"/>
    <line x1="300" y1="228" x2="297.5" y2="226.5"/>
    <line x1="290" y1="260" x2="287.5" y2="258"/>
