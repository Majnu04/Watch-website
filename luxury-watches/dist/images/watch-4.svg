  <!-- === DATE WINDOW === -->
  <rect x="254" y="194" width="22" height="14" rx="2" fill="#0a2818" stroke="#3a6a4a" stroke-width="0.5"/>
  <text x="265" y="205" font-family="Arial, sans-serif" font-size="10" fill="#d0e0d0" text-anchor="middle" font-weight="bold">26</text>

  <!-- === BRAND TEXT === -->
  <text x="200" y="165" font-family="Arial, Helvetica, sans-serif" font-size="7" fill="#b0d8b8" text-anchor="middle" letter-spacing="3" font-weight="bold">CHRONOHAUS</text>
  <text x="200" y="174" font-family="Arial, Helvetica, sans-serif" font-size="4" fill="#70a878" text-anchor="middle" letter-spacing="1.5">NAVIGATOR GMT</text>
  <text x="200" y="238" font-family="Arial, Helvetica, sans-serif" font-size="3.5" fill="#608868" text-anchor="middle" letter-spacing="1">AUTOMATIC</text>
  <text x="200" y="248" font-family="Arial, Helvetica, sans-serif" font-size="3" fill="#506858" text-anchor="middle" letter-spacing="0.8">GMT</text>

  <!-- === HANDS === -->
  <!-- Hour hand -->
  <g filter="url(#subtleShadow)">
    <polygon points="196.5,200 200,148 203.5,200" fill="#e0e0e0" stroke="#c0c0c0" stroke-width="0.3"/>
    <rect x="197" y="148" width="6" height="52" rx="1" fill="#e8e8e8"/>
    <line x1="200" y1="150" x2="200" y2="198" stroke="white" stroke-width="0.8" opacity="0.5"/>
  </g>
  <!-- Minute hand -->
  <g filter="url(#subtleShadow)">
    <polygon points="198,200 200,114 202,200" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="0.3"/>
    <rect x="198" y="114" width="4" height="86" rx="0.8" fill="#f0f0f0"/>
    <line x1="200" y1="116" x2="200" y2="198" stroke="white" stroke-width="0.6" opacity="0.4"/>
  </g>
  <!-- GMT hand (red, 4th hand with triangle tip) -->
  <line x1="200" y1="240" x2="200" y2="120" stroke="#e04040" stroke-width="1" filter="url(#subtleShadow)"/>
  <!-- GMT triangle tip -->
  <polygon points="200,120 196,132 204,132" fill="#e04040" stroke="#c03030" stroke-width="0.3"/>
  <!-- GMT counterweight -->
  <circle cx="200" cy="235" r="3" fill="#e04040"/>
  <!-- Seconds hand -->
  <line x1="200" y1="228" x2="200" y2="118" stroke="#f0f0f0" stroke-width="0.6"/>
  <circle cx="200" cy="225" r="2.5" fill="#f0f0f0"/>
  <!-- Center post -->
  <circle cx="200" cy="200" r="4" fill="#3a3a3a" stroke="#555" stroke-width="0.5"/>
  <circle cx="200" cy="200" r="2" fill="#888"/>

  <!-- === CROWN === -->
  <rect x="314" y="192" width="12" height="16" rx="2" fill="url(#crownGrad)" stroke="#707880" stroke-width="0.5"/>
  <line x1="317" y1="194" x2="317" y2="206" stroke="#b0b8c0" stroke-width="0.3"/>
  <line x1="319" y1="194" x2="319" y2="206" stroke="#b0b8c0" stroke-width="0.3"/>
  <line x1="321" y1="194" x2="321" y2="206" stroke="#b0b8c0" stroke-width="0.3"/>
  <line x1="323" y1="194" x2="323" y2="206" stroke="#b0b8c0" stroke-width="0.3"/>
  <line x1="325" y1="194" x2="325" y2="206" stroke="#b0b8c0" stroke-width="0.3"/>
  <!-- Crown guards -->
  <path d="M312 192 Q310 196 310 200 Q310 204 312 208" fill="url(#steelCase)" stroke="#808890" stroke-width="0.5"/>
  <path d="M326 192 Q328 196 328 200 Q328 204 326 208" fill="url(#steelCase)" stroke="#808890" stroke-width="0.5"/>

  <!-- === GLASS REFLECTION === -->
  <ellipse cx="185" cy="162" rx="60" ry="50" fill="url(#glassReflect)"/>
  <path d="M140 115 Q185 102 245 118 Q235 112 188 106 Z" fill="white" opacity="0.07"/>

