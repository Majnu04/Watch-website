    <line x1="110" y1="170" x2="112.5" y2="171.5"/>
    <line x1="122" y1="140" x2="124.5" y2="142"/>
    <line x1="142" y1="110" x2="144" y2="113"/>
    <line x1="180" y1="94" x2="181" y2="97.8"/>
  </g>
  <!-- Bezel lume pip at 12 -->
  <circle cx="200" cy="96" r="2.5" fill="#d8e8d0" stroke="#a0b898" stroke-width="0.3"/>

  <!-- === DIAL (green sunburst) === -->
  <circle cx="200" cy="200" r="96" fill="url(#sunburstDial)"/>
  <circle cx="200" cy="200" r="96" fill="url(#sunburstRays)"/>
  <circle cx="200" cy="200" r="96" fill="none" stroke="#104020" stroke-width="0.5"/>

  <!-- Sunburst ray lines -->
  <g stroke="white" stroke-width="0.15" opacity="0.1">
    <line x1="200" y1="200" x2="200" y2="104"/>
    <line x1="200" y1="200" x2="248" y2="112"/>
    <line x1="200" y1="200" x2="280" y2="148"/>
    <line x1="200" y1="200" x2="296" y2="200"/>
    <line x1="200" y1="200" x2="280" y2="252"/>
    <line x1="200" y1="200" x2="248" y2="288"/>
    <line x1="200" y1="200" x2="200" y2="296"/>
    <line x1="200" y1="200" x2="152" y2="288"/>
    <line x1="200" y1="200" x2="120" y2="252"/>
    <line x1="200" y1="200" x2="104" y2="200"/>
    <line x1="200" y1="200" x2="120" y2="148"/>
    <line x1="200" y1="200" x2="152" y2="112"/>
  </g>

  <!-- === HOUR MARKERS (applied indices) === -->
  <!-- 12 -->
  <rect x="195" y="108" width="10" height="18" rx="1.5" fill="#e8e8e8" filter="url(#subtleShadow)"/>
  <rect x="197" y="110" width="6" height="14" rx="0.5" fill="#f0f0f0"/>
  <!-- 1 -->
  <rect x="233" y="112" width="5" height="14" rx="1" fill="#d8d8d8" transform="rotate(30 235.5 119)"/>
  <!-- 2 -->
  <rect x="256" y="128" width="5" height="14" rx="1" fill="#d8d8d8" transform="rotate(60 258.5 135)"/>
  <!-- 3 -->
  <rect x="272" y="196" width="18" height="8" rx="1.5" fill="#e8e8e8" filter="url(#subtleShadow)"/>
  <rect x="274" y="198" width="14" height="4" rx="0.5" fill="#f0f0f0"/>
  <!-- 4 -->
  <rect x="256" y="258" width="5" height="14" rx="1" fill="#d8d8d8" transform="rotate(-60 258.5 265)"/>
  <!-- 5 -->
  <rect x="233" y="274" width="5" height="14" rx="1" fill="#d8d8d8" transform="rotate(-30 235.5 281)"/>
  <!-- 6 -->
  <rect x="195" y="274" width="10" height="18" rx="1.5" fill="#e8e8e8" filter="url(#subtleShadow)"/>
  <rect x="197" y="276" width="6" height="14" rx="0.5" fill="#f0f0f0"/>
  <!-- 7 -->
  <rect x="162" y="274" width="5" height="14" rx="1" fill="#d8d8d8" transform="rotate(30 164.5 281)"/>
  <!-- 8 -->
  <rect x="139" y="258" width="5" height="14" rx="1" fill="#d8d8d8" transform="rotate(60 141.5 265)"/>
  <!-- 9 -->
  <rect x="110" y="196" width="18" height="8" rx="1.5" fill="#e8e8e8" filter="url(#subtleShadow)"/>
  <rect x="112" y="198" width="14" height="4" rx="0.5" fill="#f0f0f0"/>
  <!-- 10 -->
  <rect x="139" y="128" width="5" height="14" rx="1" fill="#d8d8d8" transform="rotate(-60 141.5 135)"/>
  <!-- 11 -->
  <rect x="162" y="112" width="5" height="14" rx="1" fill="#d8d8d8" transform="rotate(-30 164.5 119)"/>

  <!-- Minute ticks -->
  <g stroke="#5a8a6a" stroke-width="0.4" opacity="0.5">
    <line x1="200" y1="102" x2="200" y2="107"/>
    <line x1="210" y1="102.5" x2="209.5" y2="107.2"/>
    <line x1="219.5" y1="104.5" x2="218.5" y2="109"/>
    <line x1="229" y1="108" x2="227.8" y2="112.2"/>
    <line x1="237" y1="113" x2="235.6" y2="117"/>
    <line x1="244" y1="119" x2="242.4" y2="122.8"/>
    <line x1="250.5" y1="126" x2="248.8" y2="129.5"/>
    <line x1="256" y1="134" x2="254.2" y2="137.3"/>
    <line x1="260" y1="142.5" x2="258.2" y2="145.5"/>
    <line x1="264" y1="152" x2="262.2" y2="154.8"/>
    <line x1="266.5" y1="161.5" x2="264.8" y2="164"/>
    <line x1="268.5" y1="171.5" x2="266.8" y2="173.6"/>
    <line x1="270" y1="182" x2="268.4" y2="183.8"/>
    <line x1="270" y1="192" x2="268" y2="192"/>
    <line x1="270" y1="208" x2="268" y2="208"/>
    <line x1="268.5" y1="218" x2="266.8" y2="216.4"/>
    <line x1="266.5" y1="228" x2="264.8" y2="226"/>
    <line x1="264" y1="238" x2="262.2" y2="235.2"/>
    <line x1="260" y1="248" x2="258.2" y2="244.5"/>
    <line x1="256" y1="257" x2="254.2" y2="253.7"/>
    <line x1="250.5" y1="265" x2="248.8" y2="261.5"/>
    <line x1="244" y1="272" x2="242.4" y2="268.2"/>
    <line x1="237" y1="278" x2="235.6" y2="274"/>
    <line x1="229" y1="283" x2="227.8" y2="278.8"/>
    <line x1="219.5" y1="286" x2="218.5" y2="281.5"/>
    <line x1="210" y1="288" x2="209.5" y2="283.3"/>
    <line x1="200" y1="289" x2="200" y2="284"/>
    <line x1="190" y1="288" x2="190.5" y2="283.3"/>
    <line x1="180.5" y1="286" x2="181.5" y2="281.5"/>
    <line x1="171" y1="283" x2="172.2" y2="278.8"/>
    <line x1="163" y1="278" x2="164.4" y2="274"/>
    <line x1="156" y1="272" x2="157.6" y2="268.2"/>
    <line x1="150" y1="265" x2="151.2" y2="261.5"/>
    <line x1="144" y1="257" x2="145.8" y2="253.7"/>
    <line x1="140" y1="248" x2="141.8" y2="244.5"/>
    <line x1="136" y1="238" x2="137.8" y2="235.2"/>
    <line x1="133.5" y1="228" x2="135.2" y2="226"/>
    <line x1="131.5" y1="218" x2="133.2" y2="216.4"/>
    <line x1="130" y1="208" x2="132" y2="208"/>
    <line x1="130" y1="192" x2="132" y2="192"/>
    <line x1="131.5" y1="182" x2="133.2" y2="183.6"/>
    <line x1="133.5" y1="171.5" x2="135.2" y2="173.4"/>
    <line x1="136" y1="161.5" x2="137.8" y2="164"/>
    <line x1="140" y1="152" x2="141.8" y2="154.8"/>
    <line x1="144" y1="142.5" x2="145.8" y2="145.5"/>
    <line x1="150" y1="134" x2="151.2" y2="137.3"/>
    <line x1="156" y1="126" x2="157.6" y2="129.5"/>
    <line x1="163" y1="119" x2="164.4" y2="122.8"/>
    <line x1="171" y1="113" x2="172.2" y2="117"/>
