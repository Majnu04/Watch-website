<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="dial1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="case1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4d4d4"/>
      <stop offset="50%" stop-color="#a0a0a0"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </linearGradient>
    <linearGradient id="strap1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c1810"/>
      <stop offset="50%" stop-color="#1a0f0a"/>
      <stop offset="100%" stop-color="#2c1810"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Strap top -->
  <rect x="165" y="20" width="70" height="130" rx="4" fill="url(#strap1)"/>
  <line x1="175" y1="40" x2="225" y2="40" stroke="#3a2518" stroke-width="0.5" opacity="0.5"/>
  <line x1="175" y1="55" x2="225" y2="55" stroke="#3a2518" stroke-width="0.5" opacity="0.5"/>
  <line x1="175" y1="70" x2="225" y2="70" stroke="#3a2518" stroke-width="0.5" opacity="0.5"/>
  <line x1="175" y1="85" x2="225" y2="85" stroke="#3a2518" stroke-width="0.5" opacity="0.5"/>
  <line x1="175" y1="100" x2="225" y2="100" stroke="#3a2518" stroke-width="0.5" opacity="0.5"/>

  <!-- Strap bottom -->
  <rect x="165" y="250" width="70" height="130" rx="4" fill="url(#strap1)"/>
  <line x1="175" y1="270" x2="225" y2="270" stroke="#3a2518" stroke-width="0.5" opacity="0.5"/>
  <line x1="175" y1="285" x2="225" y2="285" stroke="#3a2518" stroke-width="0.5" opacity="0.5"/>
  <line x1="175" y1="300" x2="225" y2="300" stroke="#3a2518" stroke-width="0.5" opacity="0.5"/>
  <line x1="175" y1="315" x2="225" y2="315" stroke="#3a2518" stroke-width="0.5" opacity="0.5"/>
  <line x1="175" y1="330" x2="225" y2="330" stroke="#3a2518" stroke-width="0.5" opacity="0.5"/>

  <!-- Buckle -->
  <rect x="160" y="340" width="80" height="12" rx="2" fill="#b8b8b8" stroke="#999" stroke-width="0.5"/>
  <rect x="192" y="342" width="16" height="8" rx="1" fill="none" stroke="#c9a96e" stroke-width="1"/>

  <!-- Case -->
  <circle cx="200" cy="200" r="105" fill="url(#case1)" filter="url(#shadow1)"/>
  <circle cx="200" cy="200" r="100" fill="#a8a8a8"/>
  <circle cx="200" cy="200" r="98" fill="#b0b0b0"/>

  <!-- Bezel -->
  <circle cx="200" cy="200" r="95" fill="none" stroke="#888" stroke-width="2"/>
  <circle cx="200" cy="200" r="92" fill="none" stroke="#999" stroke-width="0.5"/>

  <!-- Dial -->
  <circle cx="200" cy="200" r="85" fill="url(#dial1)"/>

  <!-- Hour markers -->
  <rect x="197" y="122" width="6" height="14" rx="1" fill="#c9a96e"/>
  <rect x="197" y="264" width="6" height="14" rx="1" fill="#c9a96e"/>
  <rect x="264" y="197" width="14" height="6" rx="1" fill="#c9a96e"/>
  <rect x="122" y="197" width="14" height="6" rx="1" fill="#c9a96e"/>
  <!-- Minor markers -->
  <rect x="230" y="130" width="3" height="8" rx="1" fill="#666" transform="rotate(30,231,134)"/>
  <rect x="258" y="160" width="3" height="8" rx="1" fill="#666" transform="rotate(60,259,164)"/>
  <rect x="258" y="232" width="3" height="8" rx="1" fill="#666" transform="rotate(120,259,236)"/>
  <rect x="230" y="262" width="3" height="8" rx="1" fill="#666" transform="rotate(150,231,266)"/>
  <rect x="167" y="262" width="3" height="8" rx="1" fill="#666" transform="rotate(210,168,266)"/>
  <rect x="139" y="232" width="3" height="8" rx="1" fill="#666" transform="rotate(240,140,236)"/>
  <rect x="139" y="160" width="3" height="8" rx="1" fill="#666" transform="rotate(300,140,164)"/>
  <rect x="167" y="130" width="3" height="8" rx="1" fill="#666" transform="rotate(330,168,134)"/>

  <!-- Sub-dial -->
  <circle cx="200" cy="235" r="18" fill="none" stroke="#333" stroke-width="0.5"/>

  <!-- Brand text -->
  <text x="200" y="175" text-anchor="middle" fill="#c9a96e" font-family="Georgia,serif" font-size="8" letter-spacing="2">CHRONOHAUS</text>
  <text x="200" y="255" text-anchor="middle" fill="#555" font-family="Arial,sans-serif" font-size="5" letter-spacing="1">AUTOMATIC</text>

  <!-- Hour hand -->
  <polygon points="197,200 200,155 203,200" fill="#c9a96e"/>
  <rect x="198" y="200" width="4" height="25" rx="1" fill="#c9a96e"/>

  <!-- Minute hand -->
  <polygon points="198,200 200,130 202,200" fill="#e0d5c0"/>
  <rect x="199" y="200" width="2" height="20" rx="0.5" fill="#e0d5c0"/>

  <!-- Second hand -->
  <line x1="200" y1="250" x2="200" y2="128" stroke="#c62828" stroke-width="1"/>

  <!-- Center cap -->
  <circle cx="200" cy="200" r="4" fill="#c9a96e"/>
  <circle cx="200" cy="200" r="2" fill="#b8942e"/>

  <!-- Glass reflection -->
  <ellipse cx="185" cy="170" rx="35" ry="25" fill="white" opacity="0.04" transform="rotate(-20,185,170)"/>

  <!-- Crown -->
  <rect x="305" y="193" width="15" height="14" rx="3" fill="#b8b8b8" stroke="#999" stroke-width="0.5"/>
  <line x1="308" y1="196" x2="308" y2="204" stroke="#999" stroke-width="0.5"/>
  <line x1="311" y1="196" x2="311" y2="204" stroke="#999" stroke-width="0.5"/>
  <line x1="314" y1="196" x2="314" y2="204" stroke="#999" stroke-width="0.5"/>
  <line x1="317" y1="196" x2="317" y2="204" stroke="#999" stroke-width="0.5"/>
</svg>
